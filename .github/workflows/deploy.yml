name: Deploy Abadía

on:
  push:
    branches: [camilo]
    paths:
      - 'abadia-front/**'
      - 'abadia-back/**'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abadia-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify the target host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          actual_fingerprint="$(ssh-keyscan -T 10 -t ed25519 "$VPS_HOST" 2>/dev/null | ssh-keygen -lf - | awk '{print $2}')"
          test -n "$actual_fingerprint"
          echo "Detected VPS host fingerprint: $actual_fingerprint"
          test "$actual_fingerprint" = "SHA256:KkiAxqPAAfkZWrdg+Z8JkCvj5W9+waXhIARGHWDw0es"

      - name: Copy application source
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: SHA256:KkiAxqPAAfkZWrdg+Z8JkCvj5W9+waXhIARGHWDw0es
          source: 'abadia-front,abadia-back'
          target: '/var/www'
          overwrite: true

      - name: Copy the Nginx candidate configuration
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: SHA256:KkiAxqPAAfkZWrdg+Z8JkCvj5W9+waXhIARGHWDw0es
          source: 'deploy/abadia1.nginx.conf'
          target: '/home/camilo/'
          strip_components: 1
          overwrite: true

      - name: Build and reload Abadía
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: SHA256:KkiAxqPAAfkZWrdg+Z8JkCvj5W9+waXhIARGHWDw0es
          script: |
            set -eu
            cd /var/www/abadia-back
            npm ci
            npm run build
            cd /var/www/abadia-front
            npm ci
            npm run build
            pm2 startOrReload /var/www/abadia-back/ecosystem.config.cjs
            pm2 save
            curl --fail --silent --show-error http://127.0.0.1:3102/health >/dev/null
            curl --fail --silent --show-error http://127.0.0.1:3100/ >/dev/null
